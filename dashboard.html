        @import url('https://fonts.googleapis.com/css?family=Roboto&display=swap');

        :root {
            --background-color: #e8f0f7;
            --header-color: #4a90e2;
            --send-color: #d1e7fd;
            --received-color: #f7f7f7;
            --blocked-color: #ffd1d1;
            --light-gray: #e0e0e0;
            --dark-gray: #757575;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Roboto", sans-serif;
            background-color: var(--background-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;

        }

        .main-container {
            margin-top: 50px;
            background-color: #ffffff;
            width: 100%;
            max-width: 1900px;
            position: relative;
            height: 555px;
            /* Adjust height to account for fixed header */
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .head-container {
            background-color: var(--header-color);
            color: #ffffff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .head-container h1 {
            font-size: 1.2rem;
            margin-left: 10px;
        }

        .head-container img {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        .message-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: url(chat2.jpg);
            /* background-color: white; */



        }

        .message-container div {
            display: flex;
            flex-direction: column;
            max-width: 50%;
        }

        .message-container p {
            word-wrap: break-word;
            white-space: pre-wrap;

        }

        .message-container .sent {
            align-self: flex-end;
            text-align: right;

        }

        .message-container .received {
            align-self: flex-start;
            text-align: left;
        }

        .message-container .blocked {
            align-self: center;
            text-align: center;
            max-width: 90%;
        }

        .message-container p {
            padding: 10px;
            border-radius: 8px;
            margin: 0;
        }

        .sent p {
            background-color: var(--send-color);

        }

        .received p {
            background-color: var(--received-color);
        }

        .blocked p {
            background-color: var(--blocked-color);
        }

        .message-container .hour {
            font-size: 0.8rem;
            color: white;
            margin-top: 5px;
        }

        .input-container {
            display: flex;
            padding: 10px;
            background-color: yellow;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
            box-shadow: inset 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .sender-name {
            color: white;
        }

        .input-container a {
            margin-left: 10px;
            background-color: var(--header-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .input-container a:hover {
            background-color: #3a7bc4;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 5px;
            /* padding: 10px 5px; */
            cursor: pointer;
            font-size: 15px;
            width: 50px;
            height: 20px;
            transition: background-color 0.3s ease;
        }

        .delete-btn:hover {
            background-color: #ff1a1a;
        }

        .edit-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 50px;
            height: 20px;
            transition: background-color 0.3s ease;
        }

        .edit-btn:hover {
            background-color: #45a049;
        }
    </style>

<body>
    <div class="header">
        <h1 id="welcomeUser"></h1>
        <div class="nav-links">
            <button id="profileBtn" onclick="goToProfile()">Profile</button>
            <button id="blogBtn" onclick="goToBlog()">Blog</button>
            <button id="logoutBtn" onclick="logout()">Log Out</button>
        </div>
    </div>
    <div class="main-container" id="container">
        <div class="head-container">
            <h1>• BadMan Chat</h1>
            <a href="#" class="btn"><img src="icon bad.webp" alt="close" class="delete" /></a>
        </div>

        <div id="messages" class="message-container">

            <!-- <div class="sent">
                <h5 class="hour"></h5>
                <p class="sent-bubble">
                 
                </p>
              </div>
              <div class="received">
                <h5 class="hour"></h5>
                <p class="received-bubble">
                  
                </p>
              </div>
              <div class="sent">
                <h5 class="hour"></h5>
                <p class="sent-bubble"></p>
              </div>
              <div class="blocked">
                <h5 class="hour">11:05</h5>
                <p class="blocked-bubble">You were blocked by the user</p>
              </div>  -->

        </div>

        <div class="input-container">
            <input type="text" id="myInput" oninput="editInput()" placeholder="Enter your message" />
            <a href="#" class="btn" onclick="sendMessage()">Send</a>

        </div>
    </div>
</body>




</html>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnNsvBE78G6y0cbMMvjn5FIni9MmdrpC4",
        authDomain: "codexplorer-46fb4.firebaseapp.com",
        databaseURL: "https://codexplorer-46fb4-default-rtdb.firebaseio.com",
        projectId: "codexplorer-46fb4",
        storageBucket: "codexplorer-46fb4.firebasestorage.app",
        messagingSenderId: "680874155974",
        appId: "1:680874155974:web:3c9214e68ba8ff7c99dcc7"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    let index = 0;
    let editIndex = null;

    function goToProfile() {
        profileBtn.innerHTML = "Loading...";
        profileBtn.disabled = true;

        setTimeout(() => {
            alert('Redirecting to profile...');
            window.location.href = 'profile.html';
            profileBtn.innerHTML = "Profile";
            profileBtn.disabled = false;
        }, 3000);
    }

    function goToBlog() {
        blogBtn.innerHTML = "Loading...";
        blogBtn.disabled = true;

        setTimeout(() => {
            alert('Redirecting to blog...');
            window.location.href = 'postblog.html';
            blogBtn.innerHTML = "Blog";
            blogBtn.disabled = false;
        }, 3000);
    }

    function logout() {
        auth.signOut().then(() => {
            alert("Logging out");
            window.location.href = "signin.html";
        }).catch((error) => {
            console.error("Error during logout: ", error);
        });
    }

    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            document.getElementById("welcomeUser").innerText = `Welcome, ${user.displayName}`;

            user.reload().then(() => {
                console.log("User object after reload:", user);
            }).catch((error) => {
                console.error("Error reloading user profile:", error.message);
            });
        } else {
            window.location.href = "signin.html";
        }
    });

    function sendMessage() {
        if (!myInput.value.trim()) {
            alert("Please enter a message");
        } else {
            if (editIndex !== null) {
                // Update the edited message
                firebase.database().ref(`chats/${editIndex}`).update({
                    message: myInput.value.trim()
                }).then(() => {
                    console.log("Message edited successfully.");
                    editIndex = null;
                    myInput.value = "";
                }).catch((error) => {
                    console.error("Error editing message: ", error.message);
                });
            } else {
                // Send a new message
                firebase.database().ref(`chats/${index}`).set({
                    sender: auth.currentUser.displayName,
                    message: myInput.value.trim(),
                    time: new Date().toLocaleTimeString(),
                }).then(() => {
                    myInput.value = "";
                }).catch((error) => {
                    console.error("Error sending message: ", error.message);
                });
            }
        }
    }

    function editInput() {
        myInput.value = myInput.value.trim() ? myInput.value.replace(myInput.value[0], myInput.value[0].toUpperCase()) : ""
    }

    function displayMessages() {
        messages.innerHTML = `Loading messages... <img src="icon bad.webp" style="margin:auto;" width="200px" height="200px" alt="loading" />`;

        const chatRef = firebase.database().ref("chats");

        chatRef.on('value', (snapshot) => {
            const data = snapshot.val() || [];
            index = data.length;
            messages.innerHTML = "";

            data.forEach((obj, i) => {
                const isSender = auth.currentUser.displayName === obj.sender;
                const designClass = isSender ? "sent" : "received";

                let chatMessage;
                if (obj.message === `<i> you deleted a message </i>`) {
                    if (isSender) {
                        chatMessage = `<p class="sent-bubble" >${obj.message}</p>`;
                        setTimeout(() => {
                            firebase.database().ref(`chats/${i}`).remove()
                                .then(() => console.log("Deleted message removed from the database."))
                                .catch((error) => console.error("Error removing deleted message: ", error.message));
                        }, 5000);
                    } else {
                        chatMessage = `<p class="received-bubble">${obj.message.replace("you", obj.sender)}</p>`;
                    }
                } else {
                    const deleteButton = isSender ? `<button class="delete-btn" onclick="deleteMessage(${i})">Delete</button>` : "";
                    const editButton = isSender ? `<button class="edit-btn" onclick="editMessage(${i}, '${obj.message}')">Edit</button>` : "";
                    chatMessage = `<p class="sent-bubble">${obj.message} ${deleteButton} ${editButton}</p>`;
                }

                messages.innerHTML += `
    <div class="${designClass}">
        <b class="sender-name">${obj.sender}</b>
        ${chatMessage}
        <span class="hour">${obj.time}</span>
    </div>`;
            });
        });
    }
    displayMessages();

    function deleteMessage(index) {
        const confirmDelete = confirm("Are you sure you want to delete this message?");
        if (confirmDelete) {
            firebase.database().ref(`chats/${index}`).update({
                message: `<i> you deleted a message </i>`
            }).then(() => {
                console.log("Message marked as deleted.");
            }).catch((error) => {
                console.error("Error marking message as deleted: ", error.message);
            });
        }
    }

    function editMessage(index, currentMessage) {
        if (currentMessage === `<i> you deleted a message </i>`) {
            alert("Deleted messages cannot be edited.");
            return;
        }
        myInput.value = currentMessage;
        editIndex = index;
    }

</script>
